name: Linux release

# Builds the Linux packages (.deb and .rpm, desktop/) and adds them to the GitHub
# release for the version, next to the APK and the Windows installer. The installed
# app updates itself from these releases (electron-updater reads latest-linux.yml).
#
#   git tag v8.4.0 && git push origin v8.4.0
#
# or run it by hand from the Actions tab with a version. On a pull request that
# changes the desktop app it only builds and uploads the packages as an artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 8.4.0'
        required: true
  pull_request:
    paths:
      - '.github/workflows/linux-release.yml'
      - 'desktop/**'
      - 'index.web.js'
      - 'metro.config.js'

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION_INPUT: ${{ github.event.inputs.version }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$VERSION_INPUT" ]; then
            VERSION="${VERSION_INPUT#v}"
          else
            VERSION="$(node -p "require('./app.json').expo.version")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not like 8.4.0"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version into app.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSION;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          '

      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      - run: npm ci
        working-directory: desktop

      - name: Build packages
        working-directory: desktop
        env:
          TARS_VERSION: ${{ steps.version.outputs.version }}
        run: npm run dist:linux

      - name: Collect files
        id: files
        working-directory: desktop/dist
        run: |
          ls -la
          V="${{ steps.version.outputs.version }}"
          DEB="TARSMusic-$V-amd64.deb"
          RPM="TARSMusic-$V-x86_64.rpm"
          test -f "$DEB"
          test -f "$RPM"
          test -f latest-linux.yml
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "rpm=$RPM" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TARSMusic-linux-${{ steps.version.outputs.version }}
          path: |
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/latest-linux.yml
          retention-days: 14

      - name: Publish to the GitHub release
        if: github.event_name != 'pull_request'
        working-directory: desktop/dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          DEB: ${{ steps.files.outputs.deb }}
          RPM: ${{ steps.files.outputs.rpm }}
        run: |
          FILES=("$DEB" "$RPM" latest-linux.yml)
          # The Android or Windows workflow may be creating the same release right now.
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${FILES[@]}" --clobber && exit 0
            else
              gh release create "$TAG" "${FILES[@]}" --title "TARSMusic ${TAG#v}" --generate-notes --target "$GITHUB_SHA" && exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1
